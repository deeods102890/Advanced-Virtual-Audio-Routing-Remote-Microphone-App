
name: Build Audio Router APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Use compatible Gradle version
        run: |
          sed -i 's/gradle-9.0-milestone-1-bin.zip/gradle-8.13-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: audio-router-debug-apk
          path: app/build/outputs/apk/debug/*.apk
